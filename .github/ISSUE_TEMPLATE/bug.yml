name: Проблем в играта
description: Възпроизводим проблем с игра, профил, класация или реклама
title: "[Bug] "
body:
  - type: input
    id: cpi
    attributes:
      label: Свързана CPI задача
      description: CPI ID или issue връзка, ако са известни.
      placeholder: 'CPI-004 · #4'
  - type: textarea
    id: observed
    attributes:
      label: Наблюдение и очакван резултат след корекция
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Стъпки за възпроизвеждане
      description: Включи версия, устройство, OS, game mode, ред и използвани продължавания. Без email, age, tokens или лични данни.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Доказателства
      description: Screenshot или sanitised run/reference ID, ако е наличен.
  - type: textarea
    id: validation
    attributes:
      label: Проверка на корекцията
      description: Кой сценарий трябва да заработи; посочи regression проверка, ако е известна.
