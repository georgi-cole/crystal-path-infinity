name: Crystal Path iOS TestFlight

on:
  pull_request:
    paths:
      - .github/workflows/ios-testflight.yml
      - .github/scripts/ios-testflight.sh
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: Sign and upload the checked beta (internal-only by default)
        type: boolean
        default: false
      campaign_beta:
        description: Offline Campaign review build with free simulated shop claims
        type: boolean
        default: false
      external_beta:
        description: Allow the offline Campaign build to be submitted for external TestFlight review
        type: boolean
        default: false
      rewarded_ads_test:
        description: Enable guest demo ads and ranked rewarded ads in staging test mode
        type: boolean
        default: false
      review_source:
        description: Use an approved iPhone review branch and its separate staging signing environment
        type: boolean
        default: false
      source_sha:
        description: Full source commit SHA to upload after its required checks pass
        type: string
        default: ''

permissions:
  contents: read
  checks: read

concurrency:
  group: cpi-ios-testflight-${{ inputs.upload_to_testflight && 'upload' || github.ref }}
  cancel-in-progress: false

jobs:
  archive:
    name: Build the Crystal Path iOS archive
    if: github.repository == 'georgi-cole/crystal-path-infinity'
    runs-on: macos-26
    timeout-minutes: 40
    environment: ${{ inputs.upload_to_testflight && (inputs.review_source && 'cpi-ios-staging-review' || 'cpi-ios-testflight') || 'cpi-ios-compile' }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      CPI_IOS_UPLOAD: ${{ inputs.upload_to_testflight || false }}
      CPI_EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
      CPI_IOS_REVIEW_SOURCE: ${{ inputs.review_source || false }}
      CPI_CAMPAIGN_BETA: ${{ inputs.campaign_beta || false }}
      CPI_EXTERNAL_BETA: ${{ inputs.external_beta || false }}
      CPI_IOS_GOOGLE_CLIENT_ID: ${{ vars.CPI_IOS_GOOGLE_CLIENT_ID }}
      VITE_IOS_PROVIDER_SIGN_IN: ${{ inputs.review_source && 'true' || 'false' }}
      CPI_APP_ENV: production
      CPI_NATIVE_PURCHASES: ${{ inputs.campaign_beta && 'false' || 'true' }}
      CPI_NATIVE_ADS: ${{ inputs.rewarded_ads_test && !inputs.campaign_beta && 'true' || 'false' }}
      CPI_IOS_ADMOB_TEST_VERSION: ${{ vars.CPI_IOS_ADMOB_TEST_VERSION }}
      VITE_ACCOUNT_API_BASE_URL: https://crystal-path-staging-api.kolequant.workers.dev/cpi
      VITE_ACCOUNT_SERVICES_ENABLED: ${{ inputs.campaign_beta && 'false' || 'true' }}
      VITE_PURCHASES_ENABLED: ${{ inputs.campaign_beta && 'false' || 'true' }}
      VITE_GUEST_REWARDED_ADS_TEST: ${{ inputs.rewarded_ads_test && 'true' || 'false' }}
      VITE_REWARDED_ADS_ENABLED: ${{ inputs.rewarded_ads_test && 'true' || 'false' }}
      VITE_CLIENT_BUILD: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Select offline Campaign gateway isolation
        if: inputs.campaign_beta
        run: echo 'VITE_ACCOUNT_API_BASE_URL=' >> "$GITHUB_ENV"
      - name: Check the source and Xcode distribution option
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/ios-testflight.sh preflight
      - name: Build the staging client with the registered store identity
        run: |
          npm ci --ignore-scripts
          if [[ "$CPI_CAMPAIGN_BETA" == true ]]; then
            export VITE_ACCOUNT_API_BASE_URL=''
            npm exec --workspace @crystal-path-infinity/mobile -- vite build --mode campaign-beta
          else
            npm run build:production
          fi
          npm run native:generate -- --platform ios --environment production
          npm run native:generate -- --platform ios --environment production --check
      - name: Resolve pinned Swift packages
        run: >-
          xcodebuild -resolvePackageDependencies
          -project apps/mobile/ios/App/App.xcodeproj -scheme App
          -disableAutomaticPackageResolution -onlyUsePackageVersionsFromResolvedFile
      - name: Install Apple signing material for this run
        if: inputs.upload_to_testflight
        env:
          CPI_IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.CPI_IOS_DISTRIBUTION_P12_BASE64 }}
          CPI_IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.CPI_IOS_DISTRIBUTION_P12_PASSWORD }}
          CPI_IOS_PROFILE_BASE64: ${{ secrets.CPI_IOS_PROFILE_BASE64 }}
        run: bash .github/scripts/ios-testflight.sh install-signing
      - name: Compile and verify the iPhone archive
        run: bash .github/scripts/ios-testflight.sh archive
      - name: Upload to internal TestFlight
        if: inputs.upload_to_testflight
        env:
          GH_TOKEN: ${{ github.token }}
          CPI_ASC_UPLOAD_KEY_BASE64: ${{ secrets.CPI_ASC_UPLOAD_KEY_BASE64 }}
          CPI_ASC_UPLOAD_KEY_ID: ${{ secrets.CPI_ASC_UPLOAD_KEY_ID }}
          CPI_ASC_UPLOAD_ISSUER_ID: ${{ secrets.CPI_ASC_UPLOAD_ISSUER_ID }}
        run: bash .github/scripts/ios-testflight.sh upload
      - name: Remove signing material from the runner
        if: always() && inputs.upload_to_testflight
        run: bash .github/scripts/ios-testflight.sh cleanup
