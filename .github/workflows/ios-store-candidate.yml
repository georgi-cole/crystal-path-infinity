name: Crystal Path iOS store candidate

on:
  pull_request:
    paths:
      - .github/workflows/ios-store-candidate.yml
      - .github/scripts/ios-store-candidate.sh
      - apps/mobile/native-templates/**
      - apps/mobile/src/account/mobile-identity-client.ts
      - apps/mobile/scripts/generate-native.mjs
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact current main commit with passing required checks
        required: true
        type: string
      version:
        description: Store version in major.minor.patch format
        required: true
        type: string
      build_number:
        description: Unused App Store build number
        required: true
        type: string
      upload_to_testflight:
        description: Upload the signed production account candidate to TestFlight
        type: boolean
        default: false

permissions:
  contents: read
  checks: read

concurrency:
  group: cpi-ios-store-candidate
  cancel-in-progress: false

jobs:
  archive:
    name: Sign the iOS live guest ad candidate
    if: github.repository == 'georgi-cole/crystal-path-infinity' && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
    runs-on: macos-26
    timeout-minutes: 40
    environment: ${{ github.event_name == 'workflow_dispatch' && 'cpi-ios-testflight' || 'cpi-ios-compile' }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      CPI_EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
      CPI_STORE_VERSION: ${{ inputs.version || '1.0.0' }}
      CPI_STORE_BUILD_NUMBER: ${{ inputs.build_number || '45' }}
      CPI_APP_ENV: production
      CPI_NATIVE_ADS: 'true'
      VITE_GUEST_REWARDED_ADS_LIVE: 'true'
      VITE_ACCOUNT_SERVICES_ENABLED: 'true'
      VITE_ACCOUNT_API_BASE_URL: https://crystalpath-api.kolequant.xyz/cpi
      VITE_NATIVE_PROVIDER_SIGN_IN: 'true'
      VITE_CLIENT_BUILD: ${{ inputs.build_number || '45' }}
      VITE_RANKED_SERVICES_ENABLED: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'
          cache: npm
      - name: Verify current main and required checks
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ATTEMPT" == 1 &&
              "$CPI_EXPECTED_SOURCE_SHA" == "$GITHUB_SHA" &&
              "$(git rev-parse HEAD)" == "$GITHUB_SHA" &&
              "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" == "$GITHUB_SHA" ]]
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs" > "$RUNNER_TEMP/cpi-source-checks.json"
          node --experimental-strip-types --input-type=module - "$RUNNER_TEMP/cpi-source-checks.json" <<'JS'
          import { readFileSync } from 'node:fs';
          import { assertSourceChecks } from './.github/scripts/unsigned-beta.mjs';
          assertSourceChecks(JSON.parse(readFileSync(process.argv[2], 'utf8')), process.env.GITHUB_SHA);
          JS
      - name: Build production assets and resolve pinned packages
        run: |
          npm ci --ignore-scripts
          npm run build:production
          npm run native:generate -- --platform ios --environment production
          npm run native:generate -- --platform ios --environment production --check
          xcodebuild -resolvePackageDependencies -project apps/mobile/ios/App/App.xcodeproj -scheme App \
            -disableAutomaticPackageResolution -onlyUsePackageVersionsFromResolvedFile
      - name: Install distribution certificate and provisioning profile
        if: github.event_name == 'workflow_dispatch'
        env:
          CPI_IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.CPI_IOS_DISTRIBUTION_P12_BASE64 }}
          CPI_IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.CPI_IOS_DISTRIBUTION_P12_PASSWORD }}
          CPI_IOS_PROFILE_BASE64: ${{ secrets.CPI_IOS_PROFILE_BASE64 }}
        run: bash .github/scripts/ios-testflight.sh install-signing
      - name: Export and verify the signed App Store package
        if: github.event_name == 'workflow_dispatch'
        run: bash .github/scripts/ios-store-candidate.sh
      - name: Upload the production account candidate for TestFlight processing
        if: inputs.upload_to_testflight && github.event_name == 'workflow_dispatch'
        env:
          CPI_ASC_UPLOAD_KEY_BASE64: ${{ secrets.CPI_ASC_UPLOAD_KEY_BASE64 }}
          CPI_ASC_UPLOAD_KEY_ID: ${{ secrets.CPI_ASC_UPLOAD_KEY_ID }}
          CPI_ASC_UPLOAD_ISSUER_ID: ${{ secrets.CPI_ASC_UPLOAD_ISSUER_ID }}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/cpi-ios-signing/upload.p8"
          trap 'rm -f "$RUNNER_TEMP/cpi-ios-signing/upload.p8"' EXIT
          python3 - "$key" <<'PY'
          import base64, os, pathlib, sys
          pathlib.Path(sys.argv[1]).write_bytes(base64.b64decode(os.environ['CPI_ASC_UPLOAD_KEY_BASE64'], validate=True))
          PY
          /usr/libexec/PlistBuddy -c 'Set :destination upload' "$RUNNER_TEMP/cpi-ios-signing/ExportOptions.plist"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/CrystalPathStore.xcarchive" -exportPath "$RUNNER_TEMP/cpi-store-upload" \
            -exportOptionsPlist "$RUNNER_TEMP/cpi-ios-signing/ExportOptions.plist" -allowProvisioningUpdates \
            -authenticationKeyPath "$key" -authenticationKeyID "$CPI_ASC_UPLOAD_KEY_ID" \
            -authenticationKeyIssuerID "$CPI_ASC_UPLOAD_ISSUER_ID"
      - name: Compile the production login integration without signing
        if: github.event_name == 'pull_request'
        run: >-
          xcodebuild -project apps/mobile/ios/App/App.xcodeproj -scheme App -configuration Debug
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          -derivedDataPath apps/mobile/build/ios-account-compile
          -disableAutomaticPackageResolution -onlyUsePackageVersionsFromResolvedFile
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'workflow_dispatch'
        with:
          name: crystal-path-ios-store-candidate
          path: |
            ${{ runner.temp }}/cpi-store-output/*.ipa
            ${{ runner.temp }}/cpi-store-output/receipt.txt
          retention-days: 7
          if-no-files-found: error
      - name: Remove signing material
        if: always() && github.event_name == 'workflow_dispatch'
        run: bash .github/scripts/ios-testflight.sh cleanup
