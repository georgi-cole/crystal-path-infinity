name: CPI Android boot readiness formatting (temporary)

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format-android-boot-code:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'cpi-visual-parity-black-hole-led-rails' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: cpi-visual-parity-black-hole-led-rails
          persist-credentials: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Canonical project Prettier, no functional edits
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          files=(apps/mobile/config/android-boot-readiness.ts apps/mobile/config/android-boot-readiness.test.ts)
          npx --no-install prettier --write "${files[@]}"
          npx --no-install prettier --check "${files[@]}"
          git add -- "${files[@]}"
          git diff --cached --name-only
          if git diff --cached --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Format Android pressure and ANR regression tests"
          git push origin HEAD:cpi-visual-parity-black-hole-led-rails
