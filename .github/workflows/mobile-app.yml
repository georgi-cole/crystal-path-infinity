name: Mobile app checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      native_services:
        description: Compile and launch AdMob + native purchases using Google demonstration inventory
        type: boolean
        default: false
  # Scheduled regressions run the full multi-launch Android and iOS profile.
  # Keep required PR checks independent: a scheduled failure never becomes a PR skip.
  schedule:
    - cron: '23 2 * * *'

permissions:
  contents: read

env:
  CPI_NATIVE_ADS: ${{ inputs.native_services == true && 'true' || 'false' }}
  CPI_NATIVE_PURCHASES: ${{ inputs.native_services == true && 'true' || 'false' }}

concurrency:
  group: mobile-app-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  web:
    name: App quality
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    outputs:
      native_mode: ${{ steps.native.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Select native verification profile from the complete diff
        id: native
        run: node .github/scripts/app-checks.mjs select
      - name: Test required-check routing and failure handling
        run: node --test .github/scripts/app-checks.test.mjs
      - name: Test targeted Android SDK download recovery without bypassing native gates
        run: node --test .github/scripts/android-sdk-system-image.test.mjs
      - name: Install the clean workspace
        run: npm ci --ignore-scripts
      - name: Record installed dependencies
        run: |
          mkdir -p apps/mobile/artifacts
          npm ls --workspace @crystal-path-infinity/mobile --depth=0 --json > apps/mobile/artifacts/npm-dependencies.json
      - name: TypeScript
        run: npm run typecheck 2>&1 | tee apps/mobile/artifacts/typecheck.log
      - name: Lint
        run: npm run lint 2>&1 | tee apps/mobile/artifacts/lint.log
      - name: Formatting
        run: npm run format:check 2>&1 | tee apps/mobile/artifacts/format.log
      - name: Application tests
        run: npm test 2>&1 | tee apps/mobile/artifacts/tests.log
      - name: Check and execute the Supabase Edge adapter in pinned Deno
        run: |
          npm exec --yes --package=deno@2.9.6 -- deno task --config supabase/functions/cpi-api/deno.json check
          npm exec --yes --package=deno@2.9.6 -- deno task --config supabase/functions/cpi-api/deno.json test
          npm exec --yes --package=deno@2.9.6 -- deno task --config supabase/functions/cpi-live/deno.json check
          npm exec --yes --package=deno@2.9.6 -- deno task --config supabase/functions/cpi-live/deno.json test
          node --experimental-strip-types --test backend/tests/gateway.test.mjs
      - name: Test unsigned packaging safeguards and artifact verification
        run: |
          node --experimental-strip-types --test .github/scripts/unsigned-beta.test.mjs
          python3 .github/scripts/test_unsigned_artifacts.py
      - name: Build all three web environments
        run: |
          for environment in development staging production; do
            case "$environment" in
              development) build_script=build ;;
              staging) build_script=build:staging ;;
              production) build_script=build:production ;;
            esac
            npm run "$build_script" 2>&1 | tee "apps/mobile/artifacts/web-${environment}.log"
            node --experimental-strip-types --input-type=module - "$environment" <<'JS'
          import { readFileSync } from 'node:fs';
          import { assertBuiltEnvironment, requireEnvironment } from './apps/mobile/config/environments.ts';
          const manifest = JSON.parse(readFileSync('apps/mobile/package.json', 'utf8'));
          const built = JSON.parse(readFileSync('apps/mobile/dist/build-info.json', 'utf8'));
          assertBuiltEnvironment(built, requireEnvironment(process.argv[2]), manifest.version);
          console.log(JSON.stringify(built));
          JS
            cp -R apps/mobile/dist "apps/mobile/artifacts/web-${environment}"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mobile-app-web-evidence
          path: apps/mobile/artifacts/
          retention-days: 7
          if-no-files-found: warn

  android:
    name: Development Android build and emulator launch
    needs: web
    if: ${{ needs.web.outputs.native_mode == 'smoke' || needs.web.outputs.native_mode == 'full' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NATIVE_PROFILE: ${{ needs.web.outputs.native_mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Install, build development assets, and generate Android
        run: |
          mkdir -p apps/mobile/artifacts
          node --version | tee apps/mobile/artifacts/node-version.txt
          java -version 2>&1 | tee apps/mobile/artifacts/java-version.txt
          npm ci --ignore-scripts
          npm ls --workspace @crystal-path-infinity/mobile --depth=0 --json > apps/mobile/artifacts/npm-dependencies.json
          npm run build 2>&1 | tee apps/mobile/artifacts/web-build.log
          npm run native:generate -- --platform android --environment development 2>&1 | tee apps/mobile/artifacts/android-generation.log
          npm run native:generate -- --platform android --environment development --check
      - name: Compile and verify the development APK
        working-directory: apps/mobile
        run: |
          bash android/gradlew -p android --no-daemon --version 2>&1 | tee artifacts/gradle-version.txt
          bash android/gradlew -p android --no-daemon --stacktrace :app:dependencies --configuration debugRuntimeClasspath 2>&1 | tee artifacts/android-dependencies.txt
          bash android/gradlew -p android --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee artifacts/android-build.log
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging android/app/build/outputs/apk/debug/app-debug.apk > artifacts/android-apk-badging.txt
          python3 - <<'PY'
          from pathlib import Path
          import json, os, re, zipfile, xml.etree.ElementTree as ET
          expected = json.loads(Path('dist/build-info.json').read_text())
          badging = Path('artifacts/android-apk-badging.txt').read_text()
          assert f"package: name='{expected['appId']}' versionCode='1' versionName='{expected['version']}'" in badging
          system = 'android.permission.INTERNET'
          internal = expected['appId'] + '.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION'
          # AndroidX may add its app-scoped signature safeguard for receivers.
          # It grants no user/device access; no other permission is accepted.
          permissions = set(re.findall(r"uses-permission(?:-sdk-\d+)?: name='([^']+)'", badging))
          allowed = {system, internal}
          if os.environ.get('CPI_NATIVE_ADS') == 'true':
              # GMA 25.4.0's ads-api -> WorkManager 2.7.0 adds these two
              # normal permissions. Confirmed in the merged-manifest blame
              # report; the baseline still accepts INTERNET only.
              allowed.update({'android.permission.ACCESS_NETWORK_STATE', 'android.permission.WAKE_LOCK', 'android.permission.FOREGROUND_SERVICE'})
          if os.environ.get('CPI_NATIVE_PURCHASES') == 'true':
              allowed.add('com.android.vending.BILLING')
          assert system in permissions and permissions <= allowed, permissions
          manifests = list(Path('android/app/build/intermediates/merged_manifests').glob('debug/**/AndroidManifest.xml'))
          assert manifests, 'Merged manifest missing'
          ns = '{http://schemas.android.com/apk/res/android}'
          for path in manifests:
              root = ET.parse(path).getroot()
              app = root.find('application')
              assert app is not None and app.get(ns + 'usesCleartextTraffic') == 'false'
              assert root.find('application/activity').get(ns + 'screenOrientation') == 'portrait'
              declared = {p.get(ns + 'name'): p.get(ns + 'protectionLevel') for p in root.findall('permission')}
              assert set(declared) <= {internal}
              if internal in permissions:
                  assert declared.get(internal) == 'signature'
          with zipfile.ZipFile('android/app/build/outputs/apk/debug/app-debug.apk') as apk:
              assert json.loads(apk.read('assets/public/build-info.json')) == expected
          Path('artifacts/android-permissions.json').write_text(json.dumps({'systemPermissions': sorted(permissions - {internal}), 'internalSignaturePermissions': sorted(permissions & {internal})}, indent=2))
          print('APK identity, version, embedded environment, portrait and permission checks passed')
          PY
      - name: Prepare the official Android emulator tools
        timeout-minutes: 12
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libpulse0 libglu1-mesa
          test -c /dev/kvm
          sudo chown "$(id -u):$(id -g)" /dev/kvm
          sudo chmod 660 /dev/kvm
          sdk_bin="$ANDROID_HOME/cmdline-tools/latest/bin"
          test -x "$sdk_bin/sdkmanager"
          test -x "$sdk_bin/avdmanager"
          "$sdk_bin/sdkmanager" --install "emulator" </dev/null 2>&1 | tee apps/mobile/artifacts/android-emulator-install.log
          # ldd alone bypasses the launcher's bundled-library search paths.
          # Keep it diagnostic; the normal executable must pass its preflight.
          ldd "$ANDROID_HOME/emulator/qemu/linux-x86_64/qemu-system-x86_64" > apps/mobile/artifacts/android-emulator-libraries.txt || true
          "$ANDROID_HOME/emulator/emulator" -version 2>&1 | tee apps/mobile/artifacts/android-emulator-version.txt
          # Offline lifecycle smoke uses the Android 16 AOSP image. The Google APIs
          # image repeatedly hit a first-boot Google-services focus-loss ANR,
          # even after BOOT_COMPLETED and broadcast idle were observed. Keep
          # actual pause/resume/native clock assertions unchanged; Google Play
          # / rewarded-ad compatibility remains a separate physical/device gate.
          bash .github/scripts/android-sdk-system-image.sh
          cpi_avd_home="$RUNNER_TEMP/cpi003-avd"
          mkdir -p "$cpi_avd_home"
          export ANDROID_AVD_HOME="$cpi_avd_home"
          printf 'ANDROID_AVD_HOME=%s\n' "$cpi_avd_home" >> "$GITHUB_ENV"
          printf 'no\n' | "$sdk_bin/avdmanager" create avd --force --name cpi003-development --path "$cpi_avd_home/cpi003-development.avd" --package "system-images;android-36;default;x86_64" --device pixel_7 2>&1 | tee apps/mobile/artifacts/android-avd-create.log
          # GitHub's fresh Pixel 7 AVD defaults to 2 cores, 1.5 GB RAM and
          # 1080x2400 SwiftShader software graphics. Archived failed runs show
          # ~71% CPU-stall PSI and ~13% IO-stall PSI during focus-loss ANRs.
          # Keep the official API 36 AOSP system image, but remove gratuitous
          # software-compositor/pixel pressure while still testing real UI.
          python3 - <<'PY'
          from pathlib import Path
          import os
          config = Path(os.environ['ANDROID_AVD_HOME']) / 'cpi003-development.avd/config.ini'
          assert config.is_file(), config
          overrides = {
              'hw.cpu.ncore': '4',
              'hw.ramSize': '3072M',
              'hw.lcd.width': '720',
              'hw.lcd.height': '1600',
              'hw.lcd.density': '320',
              'disk.dataPartition.size': '2048M',
          }
          lines = config.read_text().splitlines()
          entries = {}
          for line in lines:
              if '=' in line and not line.lstrip().startswith('#'):
                  entries[line.split('=', 1)[0].strip()] = line.split('=', 1)[1].strip()
          entries.update(overrides)
          config.write_text(''.join(f'{key}={value}\n' for key, value in entries.items()))
          for key, value in overrides.items():
              assert (key + '=' + value) in config.read_text()
          PY
          "$sdk_bin/avdmanager" list avd 2>&1 | tee apps/mobile/artifacts/android-avd-manager-list.txt
          test -f "$cpi_avd_home/cpi003-development.ini"
          cp "$cpi_avd_home/cpi003-development.ini" apps/mobile/artifacts/android-avd.ini
          cp "$cpi_avd_home/cpi003-development.avd/config.ini" apps/mobile/artifacts/android-avd-config.ini
          "$ANDROID_HOME/emulator/emulator" -list-avds | tee apps/mobile/artifacts/android-emulator-avds.txt
          python3 - <<'PY'
          from pathlib import Path
          names = Path('apps/mobile/artifacts/android-emulator-avds.txt').read_text().splitlines()
          assert 'cpi003-development' in names, names
          PY
          cp "$ANDROID_HOME/system-images/android-36/default/x86_64/source.properties" apps/mobile/artifacts/android-system-image.properties
      - name: Open the minimum screen on Android Emulator
        timeout-minutes: 12
        run: node --experimental-strip-types apps/mobile/scripts/smoke-native.mjs --platform android --profile "$NATIVE_PROFILE"
      - name: Classify Android failure without changing its result
        if: ${{ failure() }}
        run: node .github/scripts/native-failure-diagnostics.mjs --platform android
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mobile-app-android-evidence
          path: |
            apps/mobile/artifacts/
            apps/mobile/android/app/build/outputs/logs/
            apps/mobile/android/app/build/intermediates/merged_manifests/debug/
          retention-days: 7
          if-no-files-found: warn
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mobile-app-android-development
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error

  ios:
    name: Development iOS build and simulator launch
    needs: web
    if: ${{ needs.web.outputs.native_mode == 'smoke' || needs.web.outputs.native_mode == 'full' }}
    # Use the 14 GB standard host and the current supported Xcode/iOS pair.
    # OS control commands run asynchronously so attached native logs drain
    # throughout every real foreground/background transition.
    runs-on: macos-26-intel
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      NATIVE_PROFILE: ${{ needs.web.outputs.native_mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install, build development assets, and generate iOS
        run: |
          mkdir -p apps/mobile/artifacts
          node --version | tee apps/mobile/artifacts/node-version.txt
          xcodebuild -version | tee apps/mobile/artifacts/xcode-version.txt
          xcrun swift --version | tee apps/mobile/artifacts/swift-version.txt
          npm ci --ignore-scripts
          npm ls --workspace @crystal-path-infinity/mobile --depth=0 --json > apps/mobile/artifacts/npm-dependencies.json
          npm run build 2>&1 | tee apps/mobile/artifacts/web-build.log
          npm run native:generate -- --platform ios --environment development 2>&1 | tee apps/mobile/artifacts/ios-generation.log
          npm run native:generate -- --platform ios --environment development --check
      - name: Resolve SPM and compile an unsigned simulator app
        working-directory: apps/mobile
        run: |
          resolution_flags=()
          if [[ -f native-locks/Package.resolved ]]; then
            resolution_flags+=(-disableAutomaticPackageResolution -onlyUsePackageVersionsFromResolvedFile)
          fi
          xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj -scheme App "${resolution_flags[@]}" 2>&1 | tee artifacts/ios-dependencies.log
          python3 - <<'PY'
          from pathlib import Path
          import json, os
          lock = json.loads(Path('ios/App/App.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved').read_text())
          pins = {pin['identity']: pin['state'].get('version') for pin in lock['pins']}
          expected = {'capacitor-swift-pm': '8.5.3'}
          if os.environ.get('CPI_NATIVE_ADS') == 'true':
              expected.update({'swift-package-manager-google-mobile-ads': '13.11.0', 'swift-package-manager-google-user-messaging-platform': '3.1.0'})
          assert pins == expected, pins
          print('Resolved SPM graph matches pinned integrations')
          PY
          xcodebuild build -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/ios -disableAutomaticPackageResolution -onlyUsePackageVersionsFromResolvedFile CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= 2>&1 | tee artifacts/ios-build.log
          python3 - <<'PY'
          from pathlib import Path
          import json, os, plistlib
          app = Path('build/ios/Build/Products/Debug-iphonesimulator/App.app')
          info = plistlib.loads((app / 'Info.plist').read_bytes())
          expected = json.loads(Path('dist/build-info.json').read_text())
          assert info['CFBundleIdentifier'] == expected['appId']
          assert info['CFBundleShortVersionString'] == expected['version']
          assert info['CFBundleVersion'] == '1'
          assert info['UIDeviceFamily'] == [1]
          assert info['UISupportedInterfaceOrientations'] == ['UIInterfaceOrientationPortrait']
          assert 'NSAppTransportSecurity' not in info
          assert not any(key.endswith('UsageDescription') for key in info)
          if os.environ.get('CPI_NATIVE_ADS') == 'true':
              assert info['GADApplicationIdentifier'] == 'ca-app-pub-3940256099942544~1458002511'
              assert info['GADDelayAppMeasurementInit'] is True
          else:
              assert not any(key.startswith('GAD') for key in info)
          assert json.loads((app / 'public/build-info.json').read_text()) == expected
          privacy = plistlib.loads((app / 'PrivacyInfo.xcprivacy').read_bytes())
          assert privacy['NSPrivacyAccessedAPITypes'] == [{'NSPrivacyAccessedAPIType': 'NSPrivacyAccessedAPICategorySystemBootTime', 'NSPrivacyAccessedAPITypeReasons': ['35F9.1']}]
          assert privacy['NSPrivacyTracking'] is False
          assert privacy['NSPrivacyTrackingDomains'] == [] and privacy['NSPrivacyCollectedDataTypes'] == []
          Path('artifacts/ios-app-info.json').write_text(json.dumps({'buildInfo': expected, 'buildNumber': info['CFBundleVersion'], 'deviceFamily': info['UIDeviceFamily'], 'permissionPurposeStrings': []}, indent=2))
          print('Simulator app identity, version, embedded environment, portrait and permission checks passed')
          PY
          tar -czf build/cpi003-ios-simulator.tar.gz -C build/ios/Build/Products/Debug-iphonesimulator App.app
      - name: Prepare the disposable simulator host
        # Archived failures saturated the 7 GB Mac before CPI was installed.
        # Host search indexing is unrelated to our offline startup/lifecycle gate.
        # Mount the runtime before disabling indexing so mounted volumes are covered.
        run: |
          sysctl hw.memsize hw.ncpu > apps/mobile/artifacts/ios-host-hardware.txt
          xcrun simctl list --json runtimes > apps/mobile/artifacts/ios-host-runtimes.json
          sudo mdutil -a -i off 2>&1 | tee apps/mobile/artifacts/ios-host-indexing.log
      - name: Open the minimum screen on iOS Simulator
        # Allow bounded first-boot migration and process startup on a fresh simulator.
        timeout-minutes: 30
        run: node --experimental-strip-types apps/mobile/scripts/smoke-native.mjs --platform ios --profile "$NATIVE_PROFILE"
      - name: Classify iOS failure without changing its result
        if: ${{ failure() }}
        run: node .github/scripts/native-failure-diagnostics.mjs --platform ios
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mobile-app-ios-evidence
          path: |
            apps/mobile/artifacts/
            apps/mobile/ios/App/App.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
            apps/mobile/ios/App/CapApp-SPM/Package.swift
          retention-days: 7
          if-no-files-found: warn
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mobile-app-ios-development-simulator
          path: apps/mobile/build/cpi003-ios-simulator.tar.gz
          retention-days: 7
          if-no-files-found: error

  database:
    name: Backend schema and access controls
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: cpi_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: cpi_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cpi_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: cpi_ci
      PGUSER: postgres
      PGPASSWORD: cpi_ci_only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'
      - name: PostgreSQL client
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends postgresql-client
          fi
          psql --version
      - name: Apply migration to isolated empty PostgreSQL
        run: |
          psql -X -v ON_ERROR_STOP=1 -f backend/tests/bootstrap.sql
          # Test the same read-only preflight SQL used on hosted development.
          test "$(psql -X -v ON_ERROR_STOP=1 -qAt -f backend/sql/cpi017-deploy-preflight.sql | tr -d '[:space:]')" = CPI017_PRECHECK_OK
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261103000100_cpi017_foundation.sql
          # The remote post-deployment catalog audit must pass against a new
          # PostgreSQL 17 database before any hosted execution is offered.
          test "$(psql -X -v ON_ERROR_STOP=1 -qAt -f backend/sql/cpi017-deploy-postcheck.sql | tr -d '[:space:]')" = CPI017_POSTCHECK_OK
          # Execute the hosted audit SELECTs on isolated PostgreSQL first.
          temporary_audit_sql="$(mktemp)"
          trap 'rm -f "$temporary_audit_sql"' EXIT
          node backend/scripts/cpi017-hosted-audit.mjs --emit-local-sql > "$temporary_audit_sql"
          expected="$(node --input-type=module -e "import { buildAuditChecks } from './backend/scripts/cpi017-hosted-audit.mjs'; console.log(buildAuditChecks().length)")"
          results="$(psql -X -v ON_ERROR_STOP=1 -qAt -f "$temporary_audit_sql")"
          actual="$(printf '%s\n' "$results" | grep -Ec '^CPI017_AUDIT_[A-Z0-9_]+_OK$')"
          [[ "$actual" -eq "$expected" ]] || {
            echo "::error::Only $actual of $expected isolated CPI-017 security queries passed."
            exit 1
          }
          echo "All $expected isolated CPI-017 security queries passed against PostgreSQL 17."
      - name: Assert RLS, grants, privacy boundaries and server-only writes
        run: |
          psql -X -v ON_ERROR_STOP=1 -f backend/tests/assertions.sql
          bash backend/tests/negative-access.sh
      - name: Test profile privacy and immutable regional history
        run: |
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261104000100_cpi019_profiles_regions.sql
          psql -X -v ON_ERROR_STOP=1 -f backend/tests/profile-regions.sql
          bash backend/tests/profile-regions-concurrency.sh
      - name: Test durable ranked authority and authenticated server adapters
        run: |
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261104000200_cpi021_ranked_authority.sql
          psql -X -v ON_ERROR_STOP=1 -f backend/tests/ranked-storage.sql
          npm ci --ignore-scripts
      - name: Test verified publication and scoped leaderboard reads
        run: |
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261104000300_cpi023_leaderboards.sql
          psql -X -v ON_ERROR_STOP=1 -f backend/tests/leaderboards.sql
      - name: Test account export, revocation recovery and deletion
        run: |
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261104000400_cpi031_account_lifecycle.sql
          psql -X -v ON_ERROR_STOP=1 -f backend/tests/account-lifecycle.sql
      - name: Test authenticated reporting, staff decisions and complete own-data export
        run: |
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261104000500_cpi025_moderation.sql
          psql -X -v ON_ERROR_STOP=1 -f backend/tests/moderation.sql
      - name: Test rewards, saved recovery and transactional operational controls
        run: |
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261104000600_cpi026_028_rewards.sql
          psql -X -v ON_ERROR_STOP=1 -f backend/tests/rewards.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261104000650_cpi030_saved_pending.sql
          psql -X -v ON_ERROR_STOP=1 -f backend/tests/saved-pending.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261104000700_cpi032_037_operations.sql
          psql -X -v ON_ERROR_STOP=1 -f backend/tests/operations.sql
          # The current runtime requires all recovery and operational tables; execute
          # it after the complete schema, then recheck earlier adapters too.
          node --experimental-strip-types backend/tests/account-lifecycle-integration.mjs
          node --experimental-strip-types backend/tests/server-integration.mjs
          node --experimental-strip-types backend/tests/leaderboard-integration.mjs
          node --experimental-strip-types backend/tests/moderation-integration.mjs
          node --experimental-strip-types backend/tests/ranked-client-integration.mjs
          node --experimental-strip-types backend/tests/reward-integration.mjs
          node --experimental-strip-types backend/tests/operations-integration.mjs
          node --experimental-strip-types backend/tests/edge-integration.mjs
      - name: Validate independent backend environments and public-variable guard
        run: node --test backend/tests/environments.test.mjs
      - name: Test private commerce delivery and concurrent purchase replay
        env:
          CPI_RUNTIME_DB_PASSWORD: cpi-runtime-disposable-ci-only
        run: |
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261107000100_native_commerce.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261107000200_account_issuer.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261107000300_commerce_operations.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261107000400_live_economy.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261107000500_commerce_export.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261107000600_reward_launch_reviews.sql
          psql -X -v ON_ERROR_STOP=1 -f backend/live-runtime-role.sql
          node --experimental-strip-types backend/tests/commerce-integration.mjs
          node --experimental-strip-types backend/tests/live-services-integration.mjs

  required:
    name: App required checks
    if: ${{ always() }}
    needs: [web, android, ios, database]
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'
      - name: Require backend security, quality and every selected native result
        env:
          APP_CHECK_RESULTS: ${{ toJSON(needs) }}
        run: node .github/scripts/app-checks.mjs gate

# The backend security job always runs, independent of the native smoke/full/none profile.
# Stable required context: App required checks. Never put workflow-level path
# filters on this workflow; native jobs are conditional and the aggregate checks
# that 'none' was explicitly selected after successful App quality. Full means
# all original prebridge cold launches; smoke remains strict (one real launch,
# native pause/resume, bridge round-trip, screenshot, zero runtime errors).
# Scheduled/manual dispatches run full regardless of source diff.
# Commands: developer.android.com/tools/adb and tools/avdmanager;
# developer.android.com/studio/run/emulator-commandline and emulator-acceleration;
# Apple's installed `xcrun simctl help` and Xcode command-line tool reference.
# Launch artifacts demonstrate a committed minimal screen on an emulator or
# simulator, not physical-device/gameplay/ads/backend/store validation.
