# Crystal Path: Infinity — local Supabase CLI configuration.
# This project_id is a LOCAL workspace name, NOT a hosted project reference.
# Keep all dev/staging/production Supabase project refs and credentials out
# of this file. It coexists with the existing CPI-017 migrations.
project_id = "crystal-path-infinity"

[api]
# Only expose intended application-facing schemas in local Supabase.
# cpi_private and auth must NEVER be exposed in the Data API.
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]

[auth]
# Local development also keeps public/anonymous registration closed.
enable_signup = false
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = false
enable_confirmations = true
otp_length = 6
otp_expiry = 600

[functions.cpi-api]
# Preserve the platform JWT gate; unauthenticated OTP/SSV routes are not deployed.
verify_jwt = true
entrypoint = "./functions/cpi-api/index.ts"
import_map = "./functions/cpi-api/deno.json"

[functions.cpi-live]
# The separate issuer verifies its own revocable tokens; Google/Apple callbacks verify provider signatures.
# Disabled by default until an isolated project, migrations, mail and reviewed policy are configured.
verify_jwt = false
entrypoint = "./functions/cpi-live/index.ts"
import_map = "./functions/cpi-live/deno.json"

# Do not guess the hosted project's PostgreSQL version here. Once the
# development project is verified, match [db].major_version to its actual
# SHOW server_version; result before starting a local stack.
